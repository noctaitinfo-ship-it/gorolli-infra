<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Celaeno</title>
<style>
:root{--bg:#080a12;--panel:#0e1220;--text:#eceaf3;--muted:#9d9aaf;--accent:#c9a85c;--line:#252b42;--error:#ef9b9b}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}.chat{width:min(760px,100%);height:100%;margin:0 auto;padding:14px;display:grid;grid-template-rows:1fr auto auto;gap:8px}.thread{min-height:0;overflow-y:auto;padding:12px 0 24px}.msg{max-width:88%;width:fit-content;margin:8px 0;padding:10px 13px;border:1px solid var(--line);border-radius:9px;white-space:pre-wrap;overflow-wrap:anywhere}.msg.user{margin-left:auto;background:var(--panel);color:var(--muted)}.msg.oracle{margin-right:auto;border-left:2px solid var(--accent)}.msg.error{margin-right:auto;color:var(--error);border-color:#6f3f4b}.status{min-height:22px;color:var(--muted);font-size:14px}form{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px;padding-bottom:max(4px,env(safe-area-inset-bottom))}input{min-width:0;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--text);padding:13px 14px}button{min-width:78px;border:1px solid var(--accent);border-radius:7px;background:transparent;color:var(--accent);padding:13px 15px;cursor:pointer}input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}input:disabled,button:disabled{opacity:.55;cursor:wait}@media(max-width:560px){.chat{padding:9px}.msg{max-width:94%}}
</style>
</head>
<body>
<main class="chat">
  <div id="thread" class="thread" role="log" aria-live="polite" aria-label="Vestlus"></div>
  <div id="status" class="status" role="status" aria-live="polite"></div>
  <form id="chatForm" autocomplete="off">
    <input id="message" type="text" maxlength="4000" placeholder="Kirjuta sõnum" aria-label="Kirjuta sõnum" autofocus>
    <button id="sendButton" type="submit">Saada</button>
  </form>
</main>
<script>
"use strict";
const SESSION_KEY="pleiadi.session",REQUEST_TIMEOUT_MS=30000;let sessionId=sessionStorage.getItem(SESSION_KEY),busy=false;const thread=document.getElementById("thread"),statusBox=document.getElementById("status"),form=document.getElementById("chatForm"),input=document.getElementById("message"),sendButton=document.getElementById("sendButton");class ApiError extends Error{constructor(message,status=0,requestId=""){super(message);this.status=status;this.requestId=requestId}}function addMessage(text,kind){const item=document.createElement("div");item.className="msg "+kind;item.textContent=text;thread.appendChild(item);thread.scrollTop=thread.scrollHeight}function setBusy(value){busy=value;input.disabled=value;sendButton.disabled=value;if(!value)input.focus()}async function fetchJson(url,options={}){const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),REQUEST_TIMEOUT_MS);try{const response=await fetch(url,{cache:"no-store",credentials:"same-origin",...options,signal:controller.signal}),requestId=response.headers.get("x-request-id")||response.headers.get("x-trace-id")||"",raw=await response.text();let data={};if(raw){try{data=JSON.parse(raw)}catch(_){throw new ApiError("Server tagastas vigase vastuse.",response.status,requestId)}}if(!response.ok){const detail=data?.error?.message_key||data?.detail||("HTTP "+response.status);throw new ApiError(String(detail),response.status,requestId)}return data}catch(error){if(error?.name==="AbortError")throw new ApiError("Vastus aegus.");if(error instanceof ApiError)throw error;throw new ApiError("Ühendus serveriga katkes.")}finally{clearTimeout(timeout)}}async function createSession(forceNew=false){if(forceNew){sessionId=null;sessionStorage.removeItem(SESSION_KEY)}if(sessionId)return sessionId;const data=await fetchJson("/api/session",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({locale:"et",region:"EE",birth_year:1990,birth_month:1,birth_day:1,adult_confirmed:true,disclosure_ack:true})});if(!data.session_id)throw new ApiError("Server ei loonud vestlussessiooni.");sessionId=data.session_id;sessionStorage.setItem(SESSION_KEY,sessionId);return sessionId}async function sendTurn(text,forceNewSession=false){const sid=await createSession(forceNewSession);return fetchJson("/api/oracle/turn",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({session_id:sid,text,locale:"et"})})}function isSessionError(error){return[404,422].includes(error.status)&&/session|sessioon|expired|missing|not found/i.test(error.message||"")}async function submitMessage(text){if(busy)return;addMessage(text,"user");setBusy(true);statusBox.textContent="Celaeno vastab…";try{let response;try{response=await sendTurn(text,false)}catch(error){if(!isSessionError(error))throw error;response=await sendTurn(text,true)}if(!response?.text)throw new ApiError("Server ei tagastanud vastuse teksti.",0,response?.trace_id||"");addMessage(response.text,"oracle");if(response.recurring_offer?.text)addMessage(response.recurring_offer.text,"oracle")}catch(error){const reference=error.requestId?" Viide: "+error.requestId+".":(error.status?" HTTP "+error.status+".":"");addMessage("Vastus ei jõudnud kohale."+reference+" Proovi uuesti.","error")}finally{statusBox.textContent="";setBusy(false)}}form.addEventListener("submit",event=>{event.preventDefault();const text=input.value.trim();if(!text||busy)return;input.value="";submitMessage(text)});(async()=>{statusBox.textContent="Ühendan…";try{await createSession();statusBox.textContent=""}catch(_){statusBox.textContent="Ühendus ei õnnestunud. Sõnumi saatmisel proovitakse uuesti."}})();
</script>
</body>
</html>
